<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f13">
<title>Монгол орны гамшгийн эрсдэлийн хяналт · Mongolia hazard watch</title>
<meta name="description" content="Mongolia flood, wildfire and dust-storm risk zones from satellite data on Google Earth Engine.">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="bare">
<div id="map" role="application" aria-label="Газрын зураг"></div>

<aside id="side" class="side glass">
  <button id="back" class="back" type="button" hidden></button>
  <header class="brand"><h1 id="t-title"></h1><p id="t-subtitle"></p></header>
  <h2 id="t-hazards" class="cap"></h2>
  <div id="hazards" class="menu"></div>
  <h2 id="t-view" class="cap"></h2>
  <div id="modes" class="menu"></div>
  <section id="soum-box" class="soum-box" hidden>
    <input id="soum-q" class="field" type="search" autocomplete="off">
    <ol id="soum-list" class="soum-list"></ol>
  </section>
  <details id="border-box" class="fold"><summary id="t-borders"></summary><div id="borders"></div></details>
  <details id="sat" class="fold"><summary id="t-sat"></summary>
    <p id="t-sat-base" class="cap sub"></p><div id="sat-base"></div>
    <p id="t-sat-overlay" class="cap sub"></p><div id="sat-overlay"></div>
  </details>
  <details id="mine-box" class="fold" hidden><summary id="t-mine"></summary><div id="view-mine" class="tool"></div></details>
  <p id="t-footer" class="foot"></p>
  <p id="t-rights" class="foot"></p>
</aside>

<nav id="rail" class="rail" aria-label="Хэрэгсэл"></nav>
<section id="stats" class="stats glass" hidden></section>
<div id="dl-menu" class="dl-menu glass" hidden></div>

<div id="bottom" class="bottom">
  <div id="notice" class="notice" role="status" hidden></div>
  <button id="date-fold" class="date-fold" type="button"><span></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5.5 8 10.5 13 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="datebar" class="datebar glass" role="group"></div>
  <div id="legend" class="legendbar"></div>
</div>
<div id="busy" class="busy" role="status"><span id="busy-text"></span></div>
<div id="coords" class="coords"></div>
<div id="hint" class="hint"></div>
<div id="test-flag" class="test-flag" hidden></div>
<dialog id="dlg" class="dlg"></dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<noscript><p class="notice">JavaScript шаардлагатай. / JavaScript is required.</p></noscript>
<script>
  // If the module graph fails to load (for example a temporary 503 from the host), reload once, then show a message.
  function bootFailed() {
    try { if (!sessionStorage.getItem("hw.reloaded")) { sessionStorage.setItem("hw.reloaded", "1"); location.reload(); return; } } catch (e) {}
    var b = document.getElementById("notice");
    b.hidden = false;
    b.textContent = "Хуудсыг ачаалж чадсангүй. Дахин оролдох: Ctrl+F5. / Could not load the page. Try Ctrl+F5.";
  }
</script>
<script type="module" src="js/app.js" onerror="bootFailed()"></script>
</body>
</html>
