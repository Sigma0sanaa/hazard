# Research run for the Ukhaa Khudag coal-dust study (branch research/uhg-dust only).
# It does not touch main, gee-data or the live site. Each line of research/uhg/stages.txt is one parallel job;
# outputs go to an artifact, and the small ones are committed back to this branch under research/uhg/out.
name: Research UHG dust
on:
  push:
    branches: [research/uhg-dust]
    paths: ["research/uhg/*.py", "research/uhg/stages.txt", ".github/workflows/research-uhg.yml"]
permissions:
  contents: write
concurrency:
  group: research-uhg
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "jobs=$(grep -v '^#' research/uhg/stages.txt | grep -v '^$' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "earthengine-api>=1.7" numpy requests
      - name: Run ${{ matrix.job }}
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          JOB: ${{ matrix.job }}
        working-directory: research/uhg
        run: |
          set -o pipefail
          mkdir -p out
          tag=$(echo "$JOB" | tr ' :' '__')
          python -u $JOB 2>&1 | tee "out/log_${tag}.txt"
      - id: tag
        if: always()
        run: echo "tag=$(echo '${{ matrix.job }}' | tr ' :.' '___')" >> "$GITHUB_OUTPUT"
      - name: Store the arrays on branch research/uhg-data
        if: always()
        run: |
          shopt -s nullglob
          files=(research/uhg/out/*.npz research/uhg/out/*.csv.gz)
          [ ${#files[@]} -eq 0 ] && exit 0
          mkdir -p /tmp/keep && cp "${files[@]}" /tmp/keep/
          git config --global user.name "hazard-bot"
          git config --global user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            rm -rf /tmp/wt; git worktree prune
            git fetch -q --depth 1 origin research/uhg-data && git worktree add -q --detach /tmp/wt FETCH_HEAD || { sleep 10; continue; }
            cp /tmp/keep/* /tmp/wt/
            (cd /tmp/wt && git add -A && (git commit -q -m "UHG arrays: ${{ matrix.job }}" || true) && git push -q origin HEAD:research/uhg-data) && exit 0
            sleep $((RANDOM % 30 + 10))
          done
          exit 1
      - name: Commit the small outputs
        if: always()
        run: |
          git config user.name "hazard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f -- research/uhg/out ':!research/uhg/out/*.npz' ':!research/uhg/out/*.csv.gz'
          git commit -q -m "UHG research outputs: ${{ matrix.job }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin research/uhg-dust && git push -q origin HEAD:research/uhg-dust && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
