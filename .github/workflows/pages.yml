# Builds fresh hazard data every 3 hours and publishes the site to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source = "GitHub Actions".
name: Build and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the latest Earth Engine data
        run: |
          if git ls-remote --exit-code --heads origin gee-data; then
            git fetch --depth 1 origin gee-data
            rm -rf data/gee
            git checkout FETCH_HEAD -- data/gee
          fi
          # dzud came after the other hazards: where gee-data does not hold its history yet, the copy on main is kept
          for f in data/gee/dzud data/gee/monthly_dzud.bin.gz data/gee/highdays_dzud.bin.gz; do
            [ -e "$f" ] || git checkout "$GITHUB_SHA" -- "$f"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: Build live data (Open-Meteo, optional NASA FIRMS)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: node scripts/build-latest.mjs || echo "::warning::data build failed; the site will compute live in the browser"
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js vendor data docs _site/
          cp sitemap.xml google692f6804d2dc0f57.html _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # Deploying in a job of its own, as GitHub's own Pages workflow does: deploy-pages in the same job twice found
  # "0 artifacts" 0.2 s after the upload had finished (2026-11-24, runs 209 and 210), so it now starts only after the
  # build job has ended and the artifact is listed.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
